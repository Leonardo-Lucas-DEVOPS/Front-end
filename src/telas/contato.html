<section class="contato">
    <h2 id="contato-titulo">Entre em Contato</h2>
    <p class="contato-intro">Preencha o formulário abaixo e entraremos em contato o mais breve possível.</p>

    <!-- Mensagem de feedback -->
    <div id="formFeedback" 
         class="form-feedback" 
         role="status" 
         aria-live="assertive" 
         aria-atomic="true"></div>
    
    <form id="contatoForm" 
          class="formulario-contato" 
          aria-labelledby="contato-titulo" 
          novalidate>
        <!-- Informações Pessoais -->
        <fieldset>
            <legend>Informações Pessoais</legend>

            <div class="form-group">
                <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                <input type="text" 
                       id="nome" 
                       name="nome" 
                       placeholder="Seu nome completo" 
                       required 
                       minlength="3"
                       autocomplete="name"
                       aria-required="true"
                       aria-invalid="false"
                       aria-describedby="nome-erro">
                <span id="nome-erro" class="erro-campo" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">E-mail <span class="obrigatorio">*</span></label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           placeholder="seu@email.com" 
                           required
                           autocomplete="email"
                           aria-required="true"
                           aria-invalid="false"
                           aria-describedby="email-erro">
                    <span id="email-erro" class="erro-campo" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone <span class="obrigatorio">*</span></label>
                    <input type="tel" 
                           id="telefone" 
                           name="telefone" 
                           placeholder="(11) 9 9738-5214" 
                           required
                           autocomplete="tel"
                           aria-required="true"
                           aria-invalid="false"
                           aria-describedby="telefone-erro">
                    <span id="telefone-erro" class="erro-campo" role="alert" aria-live="polite"></span>
                </div>
            </div>3

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF <span class="obrigatorio">*</span></label>
                    <input type="text" 
                           id="cpf" 
                           name="cpf" 
                           placeholder="000.000.000-00" 
                           required
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                           maxlength="14" 
                           autocomplete="off"
                           aria-required="true"
                           aria-invalid="false"
                           aria-describedby="cpf-erro">
                    <span id="cpf-erro" class="erro-campo" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento" max="2025-12-31" autocomplete="bday">
            </div>
        </fieldset>

        <!-- Endereço -->
        <fieldset>
            <legend>Endereço</legend>

            <div class="form-row">
                <div class="form-group">
                    <label for="cep">CEP <span class="obrigatorio">*</span></label>
                    <input type="text" 
                           id="cep" 
                           name="cep" 
                           placeholder="00000-000" 
                           required 
                           pattern="\d{5}-?\d{3}"
                           maxlength="9" 
                           autocomplete="postal-code"
                           aria-required="true"
                           aria-invalid="false"
                           aria-describedby="cep-erro">
                    <span id="cep-erro" class="erro-campo" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" autocomplete="address-level1">
                        <option value="">Selecione</option>
                        <option value="AC">Acre (AC)</option>
                        <option value="AL">Alagoas (AL)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="SE">Sergipe (SE)</option>
                        <option value="TO">Tocantins (TO)</option>
                        <!-- Adicione outros estados conforme necessário -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" autocomplete="address-level2">
            </div>

            <div class="form-row">
                <div class="form-group flex-2">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida, etc."
                        autocomplete="street-address">
                </div>

                <div class="form-group flex-1">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" placeholder="123">
                </div>
            </div>

            <div class="form-group">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc.">
            </div>
        </fieldset>

        <!-- Motivo do Contato -->
        <fieldset>
            <legend>Motivo do Contato</legend>

            <div class="form-group">
                <label for="assunto">Assunto <span class="obrigatorio">*</span></label>
                <select id="assunto" 
                        name="assunto" 
                        required
                        aria-required="true"
                        aria-invalid="false"
                        aria-describedby="assunto-erro">
                    <option value="">Selecione um assunto</option>
                    <option value="adocao">Quero Adotar</option>
                    <option value="denuncia">Denúncia de Maus-Tratos</option>
                    <option value="doacao">Fazer uma Doação</option>
                    <option value="voluntariado">Ser Voluntário</option>
                    <option value="parceria">Proposta de Parceria</option>
                    <option value="outros">Outros</option>
                </select>
                <span id="assunto-erro" class="erro-campo" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem <span class="obrigatorio">*</span></label>
                <textarea id="mensagem" 
                          name="mensagem" 
                          rows="6" 
                          placeholder="Escreva sua mensagem aqui..." 
                          required
                          minlength="10"
                          aria-required="true"
                          aria-invalid="false"
                          aria-describedby="mensagem-erro"></textarea>
                <span id="mensagem-erro" class="erro-campo" role="alert" aria-live="polite"></span>
            </div>
        </fieldset>

        <!-- Preferências -->
        <fieldset>
            <legend>Preferências</legend>

            <div class="form-group-checkbox">
                <input type="checkbox" 
                       id="aceitaTermos" 
                       name="aceitaTermos" 
                       required
                       aria-required="true"
                       aria-invalid="false"
                       aria-describedby="termos-erro">
                <label for="aceitaTermos">
                    Aceito os <a href="#" target="_blank">termos de uso</a> e a <a href="#" target="_blank">política de
                        privacidade</a> <span class="obrigatorio">*</span>
                </label>
                <span id="termos-erro" class="erro-campo" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-group-checkbox">
                <input type="checkbox" id="receberNovidades" name="receberNovidades">
                <label for="receberNovidades">
                    Desejo receber novidades e atualizações por e-mail
                </label>
            </div>

            <div class="form-group-checkbox">
                <input type="checkbox" id="receberSMS" name="receberSMS">
                <label for="receberSMS">
                    Desejo receber notificações por SMS
                </label>
            </div>
        </fieldset>

        <!-- Botões -->
        <div class="form-actions">
            <button type="reset" class="btn-secondary">Limpar</button>
            <button type="submit" class="btn-primary">Enviar Mensagem</button>
        </div>
    </form>
</section>
